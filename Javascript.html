<script>
let USUARIO = null;
let CARRITO = [];

function ejecutarLogin() {
  const cedula = document.getElementById('input-cedula').value;
  const msg = document.getElementById('mensaje-login');
  if(!cedula) return msg.innerHTML="Ingrese cédula", msg.className="mensaje-flotante msg-error", $(msg).fadeIn();

  msg.innerHTML="<i class='fa-solid fa-spinner fa-spin'></i> Validando...";
  msg.className="mensaje-flotante msg-carga";
  $(msg).show();

  google.script.run.withSuccessHandler(res => {
    if(res) {
      USUARIO = res;
      document.getElementById('pantalla-login').style.display = 'none';
      document.getElementById('pantalla-principal').style.display = 'block';
      document.getElementById('bienvenida').innerHTML = `👋Hola, <b>${res.nombre}</b>`;
      cargarHistorial();
    } else {
      msg.innerHTML="Cédula no registrada";
      msg.className="mensaje-flotante msg-error";
    }
  }).validarIngreso(cedula);
}

function abrirModalPedido() {
  CARRITO = [];
  actualizarVistaCarrito(); // Ahora el ID ya existe en el DOM
  document.getElementById('modal-pedido').style.display = 'flex';
  google.script.run.withSuccessHandler(lista => {
    const s = document.getElementById('select-prenda');
    s.innerHTML = '<option value="">Seleccione...</option>';
    lista.forEach(p => s.appendChild(new Option(p, p)));
  }).obtenerUniformesPorRol(USUARIO.sexo, USUARIO.rol);
}

function cambioPrenda() {
  const prenda = document.getElementById('select-prenda').value;
  google.script.run.withSuccessHandler(tallas => {
    const s = document.getElementById('select-talla');
    s.innerHTML = '<option value="">...</option>';
    tallas.forEach(t => s.appendChild(new Option(t, t)));
  }).obtenerTallasPorUniforme(prenda);
}

function cambioTalla() {
  const p = document.getElementById('select-prenda').value;
  const t = document.getElementById('select-talla').value;
  google.script.run.withSuccessHandler(c => document.getElementById('input-codigo').value = c)
    .obtenerCodigoUniforme(p, t);
}

function agregarAlCarrito() {
  const p = document.getElementById('select-prenda').value;
  const t = document.getElementById('select-talla').value;
  const c = document.getElementById('input-codigo').value;
  if(!p || !t || c === 'N/A') return alert("Complete los datos");

  CARRITO.push({ prenda: p, talla: t, codigo: c });
  actualizarVistaCarrito();
}

function actualizarVistaCarrito() {
  const lista = document.getElementById('lista-carrito');
  if(!lista) return; // Salvaguarda
  lista.innerHTML = "";
  CARRITO.forEach((item, i) => {
    lista.innerHTML += `<tr><td>${item.prenda}</td><td>${item.talla}</td>
    <td><i class="fa-solid fa-trash" style="color:red; cursor:pointer" onclick="quitar(${i})"></i></td></tr>`;
  });
  document.getElementById('btn-enviar').disabled = CARRITO.length === 0;
}

function quitar(i) { CARRITO.splice(i, 1); actualizarVistaCarrito(); }

function finalizarPedido() {
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true; btn.innerHTML = "Enviando...";
  google.script.run.withSuccessHandler(msg => {
    alert(msg); cerrarModal(); cargarHistorial();
  }).guardarPedidoMasivo(CARRITO, USUARIO);
}

function cargarHistorial() {
  const div = document.getElementById('render-historial');
  div.innerHTML = "<center><i class='fa-solid fa-spinner fa-spin'></i></center>";
  google.script.run.withSuccessHandler(datos => {
    if(datos.length === 0) {
      div.innerHTML = `<div class="vacio-estilo"><i class="fa-solid fa-box-open" style="font-size:40px; color:#ccc"></i><p>No hay solicitudes previas</p></div>`;
      return;
    }
    let h = `<table class="table-res"><thead><tr><th>Fecha</th><th>Prenda</th><th>Talla</th></tr></thead><tbody>`;
    datos.forEach(f => h += `<tr><td>${new Date(f[0]).toLocaleDateString()}</td><td>${f[2]}</td><td>${f[3]}</td></tr>`);
    div.innerHTML = h + "</tbody></table>";
  }).obtenerHistorial(USUARIO.cedula);
}

function cerrarModal() { document.getElementById('modal-pedido').style.display = 'none'; }
</script>
