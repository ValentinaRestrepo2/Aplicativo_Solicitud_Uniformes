<style>
  /* Base - Responsive para móvil primero */
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    padding: 10px;
    margin: 0;
  }
  .app-container {
    background-color: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    max-width: 600px; /* Limita el ancho para web, pero flexible en móvil */
    margin: 20px auto;
  }

  thead{
    text-align: center;
    
  }
  
  /* Estilos de Formulario (Intuitivo) */
  input[type="number"], input[type="text"], select, button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    display: inline-block;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-weight: bold;
    box-sizing: border-box; /* Crucial para responsive */
  }
  label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
  }
  button {
    background-color: #007bff;
    color: white;
    cursor: pointer;
    font-size: 16px;
  }
  .cancel-button {
      background-color: #6c757d;
  }

  /* Estilos del Historial */
  #solicitudes-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  #solicitudes-table th, #solicitudes-table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
  }
  
  /* MODAL FLOTANTE */
  .modal-backdrop {
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.4); 
    display: flex; /* Centrar el contenido */
    justify-content: center;
    align-items: center;
  }
  .modal-content {
    background-color: #fefefe;
    margin: auto;
    padding: 20px;
    border: 1px solid #888;
    width: 90%; /* Responsive: 90% del ancho */
    max-width: 500px; /* Límite en pantallas grandes */
    border-radius: 8px;
  }
  
  .error {
    color: red;
    font-weight: bold;
    margin-top: 10px;
  }

  /* Media Query (Opcional, pero bueno para tablet/desktop) */
  @media (min-width: 600px) {
    .app-container {
      padding: 30px;
    }
  }

  input[readonly], 
select[readonly] {
  background-color: #e9ecef; /* Un gris muy claro */
  color: #495057;           /* Un texto un poco más oscuro */
  border: 1px dashed #ced4da; /* Borde de puntos o guiones para indicar inactividad */
  cursor: default;          /* Mantiene el cursor por defecto (no de texto) */
  font-weight: bold;        /* Opcional: para destacar la información */
}

/* Evitar que se resalte al hacer clic (focus) */
input[readonly]:focus {
  outline: none;
  box-shadow: none;
}
</style>
